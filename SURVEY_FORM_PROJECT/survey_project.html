<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Music Fan Survey Form">
  <title>Music Fan Survey</title>
</head>
<body>

  <h1 id="title">Music Fan Survey</h1>

  <p id="description">
    Tell us about your music taste and listening habits.
  </p>

  <form id="survey-form">

    <label id="name-label" for="name">Your Name</label><br>
    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      required
    >
    <br><br>

    <label id="email-label" for="email">Email Address</label><br>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >
    <br><br>

    <label id="number-label" for="number">Hours of Music per Day</label><br>
    <input
      type="number"
      id="number"
      placeholder="1 - 24"
      min="1"
      max="24"
    >
    <br><br>

    <label for="dropdown">Favorite Music Genre</label><br>
    <select id="dropdown">
      <option value="">Select a genre</option>
      <option value="rock">Rock</option>
      <option value="pop">Pop</option>
      <option value="hiphop">Hip-Hop</option>
      <option value="electronic">Electronic</option>
      <option value="jazz">Jazz</option>
    </select>

    <br><br>

    <p>How do you usually listen to music?</p>

    <label>
      <input
        type="radio"
        name="platform"
        value="streaming"
      >
      Streaming Services
    </label>

    <label>
      <input
        type="radio"
        name="platform"
        value="vinyl"
      >
      Vinyl/CD
    </label>

    <label>
      <input
        type="radio"
        name="platform"
        value="downloads"
      >
      Downloads
    </label>

    <br><br>

    <p>Which of these do you enjoy?</p>

    <label>
      <input
        type="checkbox"
        value="concerts"
      >
      Live Concerts
    </label>

    <label>
      <input
        type="checkbox"
        value="vinyl"
      >
      Collecting Vinyl
    </label>

    <label>
      <input
        type="checkbox"
        value="playInstrument"
      >
      Playing an Instrument
    </label>

    <label>
      <input
        type="checkbox"
        value="discovering"
      >
      Discovering New Artists
    </label>

    <br><br>

    <label for="comments">Tell us about your favorite artist or album:</label><br>
    <textarea
      id="comments"
      rows="5"
      cols="40"
      placeholder="Share your thoughts..."
    ></textarea>

    <br><br>

    <button id="submit" type="submit">Submit Survey</button>

  </form>

</body>
</html>
